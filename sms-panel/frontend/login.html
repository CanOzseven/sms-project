<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ring Panel - Giriş</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e14;
      --bg-secondary: #1a1e2e;
      --bg-tertiary: #252a3a;
      --text-primary: #e4e6eb;
      --text-secondary: #b0b3b8;
      --border-color: #3a3f4e;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      font-size: 32px;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .logo p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 15px;
      transition: all 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary);
      background: var(--bg-primary);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 12px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border-color);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--text-secondary);
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>Ring Panel</h1>
      <p>SMS Yönetim Sistemi</p>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="loading" id="loadingMessage">
      <span class="spinner"></span>
      <span>Giriş yapılıyor...</span>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Kullanıcı Adı</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          placeholder="kullanici_adi"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password">Şifre</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          placeholder="••••••••"
          required
        >
      </div>

      <button type="submit" class="btn" id="loginBtn">Giriş Yap</button>
    </form>

    <div class="footer">
      <p>© 2024 Ring Panel. Tüm hakları saklıdır.</p>
    </div>
  </div>

  <script>
    const API_URL = 'http://195.179.229.121:3000/api';

    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorMessage = document.getElementById('errorMessage');
    const loadingMessage = document.getElementById('loadingMessage');

    // Zaten giriş yapmışsa redirect et
    window.addEventListener('DOMContentLoaded', () => {
      const adminToken = localStorage.getItem('adminToken');
      const userToken = localStorage.getItem('userToken');

      if (adminToken) {
        window.location.href = 'admin-panel.html';
      } else if (userToken) {
        window.location.href = 'user-panel.html';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showError('Lütfen tüm alanları doldurun');
        return;
      }

      try {
        // UI güncellemesi
        loginBtn.disabled = true;
        errorMessage.classList.remove('show');
        loadingMessage.classList.add('show');

        // API isteği
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Giriş başarısız');
        }

        // Başarılı giriş
        if (data.success && data.token && data.user) {
          // Role'e göre token kaydet
          if (data.user.role === 'admin') {
            localStorage.setItem('adminToken', data.token);
            localStorage.removeItem('userToken');
            window.location.href = 'admin-panel.html';
          } else if (data.user.role === 'user') {
            localStorage.setItem('userToken', data.token);
            localStorage.removeItem('adminToken');
            window.location.href = 'user-panel.html';
          } else {
            throw new Error('Geçersiz kullanıcı rolü');
          }
        } else {
          throw new Error('Giriş yanıtı geçersiz');
        }
      } catch (error) {
        console.error('Login error:', error);
        showError(error.message);
        loginBtn.disabled = false;
        loadingMessage.classList.remove('show');
      }
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');

      // Otomatik gizle
      setTimeout(() => {
        errorMessage.classList.remove('show');
      }, 5000);
    }
  </script>
</body>
</html>
